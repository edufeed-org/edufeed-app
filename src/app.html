<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#E9570D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192x192.png" />

    <!-- Pre-hydration theme: set data-theme from localStorage before first paint.
         Mirrors the effectiveTheme derivation in src/lib/stores/app-settings.svelte.js (see $derived).
         Keep both in sync when adding/removing theme families. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var s = JSON.parse(localStorage.getItem('app-settings') || '');
          var family = s.themeFamily || 'default';
          var mode = s.colorMode || 'light';
          if (mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (mode === 'dark') {
            theme = family === 'stil' ? 'stil-dark' : family === 'rpi' ? 'rpi-dark' : 'dark';
          } else {
            theme = family === 'stil' ? 'stil' : family === 'rpi' ? 'rpi' : 'light';
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Hide app content until Svelte sets .app-ready, show branded loader instead -->
    <style>
      body:not(.app-ready) > div[style="display: contents"] {
        opacity: 0;
        pointer-events: none;
      }
      body.app-ready > div[style="display: contents"] {
        opacity: 1;
        transition: opacity 100ms ease-in;
      }
      body.app-ready #app-loader {
        display: none !important;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        z-index: 9999;
      }
      #app-loader .loader-spinner {
        width: 2rem;
        height: 2rem;
        border: 3px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: loader-spin 0.8s linear infinite;
        opacity: 0.5;
      }
      #app-loader .loader-quote {
        max-width: 24rem;
        text-align: center;
        font-style: italic;
        opacity: 0.6;
        font-size: 0.875rem;
        line-height: 1.4;
      }
      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div id="app-loader">
      <img src="%sveltekit.assets%/icon-192x192.png" alt="" width="64" height="64" />
      <div class="loader-spinner"></div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
