name: Build and Push Docker Image

on:
  push:
    branches: [main, dev]

env:
  REGISTRY: git.edufeed.org
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: docker-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Forgejo Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and push
        run: |
          REF_NAME="${{ github.ref_name }}"
          TAG="latest"
          if [ "$REF_NAME" != "main" ]; then
            TAG="$REF_NAME"
          fi
          docker buildx build \
            --push \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG} \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            --cache-from type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-v2 \
            --cache-to type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-v2,mode=max \
            .
