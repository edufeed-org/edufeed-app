name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: git.edufeed.org
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: docker-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Forgejo Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      # A release is two pushes of the SAME commit (main, then the v* tag), and
      # the image is a pure function of the commit. Every main push publishes
      # :sha-<sha> only after the smoke test passed, so when that tag already
      # exists the tag run can reuse it instead of spending another full
      # --no-cache build on an identical tree. Pulling (not `manifest inspect`)
      # keeps the step a plain docker command; a missing tag just fails the pull.
      - name: Reuse the image already published for this commit
        id: reuse
        run: |
          REG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          if docker pull "$REG:sha-${{ github.sha }}"; then
            docker tag "$REG:sha-${{ github.sha }}" edufeed-app:ci-${{ github.sha }}
            echo "Reusing $REG:sha-${{ github.sha }} (already built and smoke-tested)."
            hit=true
          else
            echo "No published image for this commit yet - building."
            hit=false
          fi
          # Forgejo documents $FORGEJO_OUTPUT; the runner also exports the
          # GitHub-compatible name. Write whichever exists.
          for out in "$FORGEJO_OUTPUT" "$GITHUB_OUTPUT"; do
            [ -n "$out" ] && echo "hit=$hit" >> "$out"
          done

      # Build to a local image WITHOUT cache. A stale buildkit layer cache on the
      # self-hosted runner previously produced images where Paraglide message
      # functions were bundled as `undefined`, crashing SSR. Building clean and
      # smoke-testing before publishing guarantees we only roll a working image.
      - name: Build image (no cache)
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        run: |
          docker buildx build \
            --no-cache \
            --load \
            --tag edufeed-app:ci-${{ github.sha }} \
            .

      - name: Smoke test (must render / with HTTP 200 before publishing)
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        run: |
          docker rm -f edufeed-smoke 2>/dev/null || true
          docker run -d --name edufeed-smoke edufeed-app:ci-${{ github.sha }}
          ok=0
          # Probe from INSIDE the container with node (the image has no curl, and a
          # published -p port is not reachable from this step's network namespace on
          # the docker-out-of-docker runner — curl localhost always got HTTP 000).
          # node is guaranteed present (it runs the server); localhost:3000 here is
          # the server's own namespace. Mirrors the Dockerfile HEALTHCHECK.
          # Runs with node's default 16KB header limit on purpose: the / response
          # once carried a ~20KB modulepreload Link header, every probe errored
          # ("Header overflow"), printed 000, and the smoke test failed for a
          # month (2026-07-29..09-01). The header is now folded into the HTML
          # head (src/lib/server/link-header.js); a "Header overflow" here means
          # that regression is back — fix the header, don't raise the limit.
          for i in $(seq 1 45); do
            code=$(docker exec edufeed-smoke node -e "require('http').get('http://localhost:3000/',r=>{console.log(r.statusCode);process.exit(0)}).on('error',(e)=>{console.error(e.message);console.log('000');process.exit(0)})" 2>/dev/null || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          echo "--- container logs ---"
          docker logs edufeed-smoke 2>&1 | tail -40
          docker rm -f edufeed-smoke 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "Smoke test FAILED: image does not render / with 200 — not publishing."
            exit 1
          fi

      # Release-based tagging: every push to main publishes :dev (staging,
      # dev.edufeed.org tracks main HEAD). A v* tag publishes :vX.Y.Z and
      # moves :latest, which prod's manual Ansible deploy pulls — so prod
      # only ever advances when a release tag is cut.
      - name: Tag and push (only after smoke test passes)
        run: |
          REF_NAME="${{ github.ref_name }}"
          REG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$REF_NAME latest"
          else
            TAGS="dev"
          fi
          docker tag edufeed-app:ci-${{ github.sha }} $REG:sha-${{ github.sha }}
          docker push $REG:sha-${{ github.sha }}
          for TAG in $TAGS; do
            docker tag edufeed-app:ci-${{ github.sha }} $REG:${TAG}
            docker push $REG:${TAG}
          done
